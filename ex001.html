<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- Usada para configurar caracteres -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meu Primeiro Progama</title>

    <!------------- INÍCIO DO CSS ------------->
    <style>
      body {
        background-color: rgb(110, 136, 207); /* Cor de fundo da página*/
        color: white; /* Cor do texto */
        font: normal 20pt "Calibri"; /* Tamanho e tipo de fonte da página */
      }
      h1 { 
        color: rgb(204, 169, 14); /* Cor do título */
        font: normal 30pt "Comic Sans MS"; /* Tamanho e tipo de fonte do título */
      }
    </style>
    <!------------- FIM DO CSS ------------->

  </head>
  <body>
    <h1>Olá, mundo!</h1>
    <p>Já me livrei da maldição!!</p>
    <!------------- COMEÇO DO JAVASCRIPT JS ------------->
    <script>
        window.alert('Minha primeira mensagem'); // Janela de Alerta. Exibe apenas um botão OK.
        window.confirm('Está gostando de JS?'); // Janela de Confirmação. Exibe botão OK e Cancelar.
        window.prompt('Qual é o seu nome?'); // Janela Prompt. Exibe um campo de texto para o usuário digitar algo.
    </script>
    <!------------- FIM DO JAVASCRIPT JS ------------->
  </body>
</html>
