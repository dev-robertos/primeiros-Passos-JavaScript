<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- Usada para configurar caracteres -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meu Primeiro Progama</title>

    <!------------- INÍCIO DO CSS ------------->
    <style>
      body {
        background-color: rgb(110, 136, 207); /* Cor de fundo da página*/
        color: white; /* Cor do texto */
        font: normal 20pt "Calibri"; /* Tamanho e tipo de fonte da página */
      }
      h1 { 
        color: rgb(204, 169, 14); /* Cor do título */
        font: normal 30pt "Comic Sans MS"; /* Tamanho e tipo de fonte do título */
      }
    </style>
    <!------------- FIM DO CSS ------------->

  </head>
  <body>
    <h1>Olá, mundo!</h1> <!-- Isso é um comentário em HTML -->
    <p>Já me livrei da maldição!!</p>
    <!------------- COMEÇO DO JAVASCRIPT JS ------------->
    <script>
        var n1 = Number(window.prompt("Digite um número: ")); // String to Number
        var n2 = Number(window.prompt("Digite outro número: ")); // String to Number
        var s = n1 + n2;

        window.alert(`A soma entre ${n1} e ${n2} é igual à ${s}`); // Concatenação
        // (number + number) para adição
        // (string + string) para concatenação
    </script>
    <!------------- FIM DO JAVASCRIPT JS ------------->
  </body>
</html>
