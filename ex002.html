<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- Usada para configurar caracteres -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meu Primeiro Progama</title>

    <!------------- INÍCIO DO CSS ------------->
    <style>
      body {
        background-color: rgb(110, 136, 207); /* Cor de fundo da página*/
        color: white; /* Cor do texto */
        font: normal 20pt "Calibri"; /* Tamanho e tipo de fonte da página */
      }
      h1 { 
        color: rgb(204, 169, 14); /* Cor do título */
        font: normal 30pt "Comic Sans MS"; /* Tamanho e tipo de fonte do título */
      }
    </style>
    <!------------- FIM DO CSS ------------->

  </head>
  <body>
    <h1>Olá, mundo!</h1> <!-- Isso é um comentário em HTML -->
    <p>Já me livrei da maldição!!</p>
    <!------------- COMEÇO DO JAVASCRIPT JS ------------->
    <script>
        var nome =window.prompt('Qual é o seu nome?'); // Janela Prompt. Exibe um campo de texto para o usuário digitar algo.
        window.alert("É um grande prazer te conhecer, " + nome + "!"); //Concatenação de strings. Exibe o nome digitado pelo usuário.
        var idade = window.prompt('Qual é a sua idade?'); // Janela Prompt. Exibe um campo de texto para o usuário digitar algo.
        window.alert("Você tem " + idade + " anos!"); //Concatenação de strings. Exibe a idade digitada pelo usuário.
    </script>
    <!------------- FIM DO JAVASCRIPT JS ------------->
  </body>
</html>
