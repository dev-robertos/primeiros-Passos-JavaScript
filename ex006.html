<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos DOM</title>

    <!-------------- INICIO CSS -------------->
    <style>
        div#area {
            font: normal 20pt Arial;
            background-color: green;
            color: white;
            width: 200px;
            height: 200px;
            line-height: 200px;
            text-align: center;
        }
    </style>
    <!-------------- FIM CSS -------------->

</head>
<body>
    <div id="area"> <!-- Para funcionar acrescente o código seguinte dentro da div: onclick="clicar()" onmouseenter="entrar()" onmouseout="sair()". São os eventos do DOM aplicados no HTML -->
        Interaja...
    </div>

    <!-------------- INICIO JS -------------->
    <script>

        var a = window.document.getElementById("area") // Criação de uma variável que recebe o elemento div com id "area". Dessa forma, o elemento div se torna manipulável por meio da variável "a"

        // Eventos DOM aplicados no JS.
        a.addEventListener('click', clicar)
        a.addEventListener('mouseenter', entrar)
        a.addEventListener('mouseout', sair)

        // Funções que serão executadas quando os eventos forem acionados.
        function clicar() {
            a.innerHTML = "<strong>Clicou!</strong>"
            a.style.background = 'red'
        }

        function entrar() {
            a.innerHTML = "<strong>Entrou!</strong>"
            
        }

        function sair() {
            a.innerHTML = "<strong>Saiu!</strong>"
            a.style.background = 'green'
        }
    </script>
    <!-------------- FIM JS -------------->
</body>
</html>
